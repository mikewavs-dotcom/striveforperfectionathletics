[project]
name = "prospect-playground"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "sqlalchemy>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings",
    "httpx",
    "selectolax",
    "playwright",
    "apscheduler",
    "anthropic",
    "alembic",
    "psycopg[binary]",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = ["mypy", "pytest"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
